[workspace]
resolver = "2"
members = ["crates/pi-core", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

# Tests der großen Zahlen sind im Debug-Build unerträglich langsam.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.pi-core]
opt-level = 3
